[package]
name = "rustream"
version = "0.1.0"
edition = "2021"

[dependencies]
# Async runtime
tokio = { version = "1.41", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }

# HTTP server
axum = "0.7"
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "trace", "cors"] }

# Database
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "migrate"] }

# Audio metadata and parsing
lofty = "0.21"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
symphonia = { version = "0.5", features = ["all"] }

# File system scanning
walkdir = "2.5"
notify = "6.1"

# Text encoding
encoding_rs = "0.8"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Utilities
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
include_dir = "0.7"
uuid = { version = "1.11", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
hex = "0.4"
base64 = "0.22"
rand = "0.8"
argon2 = "0.5"
chacha20poly1305 = "0.10"
bytes = "1"
futures-util = "0.3"

# HTTP client for YTM
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2", "charset", "socks", "stream"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
