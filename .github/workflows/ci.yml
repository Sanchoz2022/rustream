name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test

  ui:
    name: Web UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rustream-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rustream-ui/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: static
          path: static

  release:
    name: Release (musl)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [backend, ui]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build binary
        run: cargo build --release --locked --target x86_64-unknown-linux-musl
      - uses: actions/download-artifact@v4
        with:
          name: static
          path: static
      - name: Package
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          cp target/x86_64-unknown-linux-musl/release/rustream dist/
          tar -czf "dist/rustream-${version}-x86_64-linux-musl.tar.gz" -C dist rustream
          tar -czf "dist/rustream-${version}-static.tar.gz" -C static .
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
